name: Initialize Template Repository

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  init-repo:
    # Runs only in repositories created from the template, not in the template itself.
    if: github.repository != 'tanzhongyan-org/template-ts-backend'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      initialized: ${{ steps.marker.outputs.initialized }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The push step below authenticates with an explicit header, so the token is not persisted in .git/config.
          persist-credentials: false

      - name: Check the template has not been initialized yet
        id: marker
        run: |
          if grep -q "template-ts-backend" package.json; then
            echo "initialized=true" >> "$GITHUB_OUTPUT"
          else
            echo "Template placeholders are already replaced; nothing to do."
            echo "initialized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename template placeholders
        if: steps.marker.outputs.initialized == 'true'
        run: |
          NEW_NAME="${GITHUB_REPOSITORY#*/}"
          NEW_SNAKE="$(printf '%s' "$NEW_NAME" | tr '-' '_' | tr -c 'A-Za-z0-9_\n' '_')"
          echo "Renaming template-ts-backend to $NEW_NAME..."
          find . -type f \( -name "*.json" -o -name "*.jsonc" -o -name "*.ts" -o -name "*.md" -o -name "*.yml" -o -name "*.yaml" -o -name ".env.example" \) \
            -not -path "./.git/*" \
            -not -path "./.github/workflows/*" \
            -not -path "*/node_modules/*" \
            -exec sed -i \
              -e "s#tanzhongyan-org/template-ts-backend#${GITHUB_REPOSITORY}#g" \
              -e "s#template-ts-backend#${NEW_NAME}#g" \
              -e "s#template_ts_backend#${NEW_SNAKE}#g" {} +

      - name: Commit and push changes
        if: steps.marker.outputs.initialized == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: initialize repository from template"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:main

  follow-ups:
    name: Open follow-up issue
    needs: init-repo
    if: needs.init-repo.outputs.initialized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open the "Template follow-ups" issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Resolve each marker below, then close this issue."
            echo
            echo '```text'
            make template-debt
            echo '```'
          } > body.md
          gh issue create --title "Template follow-ups" --body-file body.md
