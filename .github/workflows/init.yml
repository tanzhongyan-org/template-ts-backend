name: Initialize Template Repository

on:
  workflow_dispatch:

permissions: {}

jobs:
  init-repo:
    # Runs only in repositories created from the template, not in the template itself.
    if: github.repository != 'tanzhongyan-org/template-ts-backend'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rename template placeholders
        run: |
          NEW_NAME="${GITHUB_REPOSITORY#*/}"
          echo "Renaming template-ts-backend to $NEW_NAME..."
          find . -type f \( -name "*.json" -o -name "*.ts" -o -name "*.md" -o -name "*.jsonc" -o -name "*.yml" \)             -not -path "*/.git/*"             -not -path "./.github/workflows/*"             -not -path "*/node_modules/*"             -exec sed -i "s/template-ts-backend/$NEW_NAME/g" {} +

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: initialize repository from template-ts-backend"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push

  follow-ups:
    name: Open follow-up issue
    needs: init-repo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open the "Template follow-ups" issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Resolve each marker below, then close this issue."
            echo
            echo '```text'
            make template-debt
            echo '```'
          } > body.md
          gh issue create --title "Template follow-ups" --body-file body.md
