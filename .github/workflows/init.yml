name: Initialize Template Repository

on:
  workflow_dispatch:

jobs:
  init-repo:
    # Only run on repositories created from the template, not on the template itself
    if: github.repository != 'tanzhongyan-org/template-ts-backend'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Rename template placeholders
        run: |
          NEW_NAME="${GITHUB_REPOSITORY#*/}"
          echo "Renaming template-ts-backend to $NEW_NAME..."
          find . -type f \( -name "*.json" -o -name "*.ts" -o -name "*.md" -o -name "*.jsonc" -o -name "*.yml" \) \
            -not -path "*/.git/*" \
            -not -path "*/.github/*" \
            -not -path "*/node_modules/*" \
            -exec sed -i "s/template-ts-backend/$NEW_NAME/g" {} +

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: initialize repository from template-ts-backend"
          git push
