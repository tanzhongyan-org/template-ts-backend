name: DAST

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast:
    uses: tanzhongyan-org/.github/.github/workflows/dast.yml@0c54f703d2d0d24b6ec61c8ea0f0d1a7d220f3e9 # v1
    with:
      runtime: ts-backend
      tool: schemathesis
      postgres-db: template_ts_backend
      database-url: postgresql://postgres:password@localhost:5432/template_ts_backend
      base-url: http://localhost:3000
      health-url: http://localhost:3000/health
      install-command: bun install --frozen-lockfile
      db-setup-command: make db-push
      start-command: bun src/index.ts
