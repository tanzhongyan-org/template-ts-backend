name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verification-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: "Gate 1: Typecheck"
        run: npm run typecheck

      - name: "Gate 2: Lint and Format"
        run: npm run lint

      - name: "Gate 3: Unit and Contract Tests"
        run: npm test

      - name: "Gate 5: Duplication Audit"
        run: npx --yes fallow@3.33.1 dupes --quiet --no-fragments

      - name: "Gate 6: Anti-Slop Scan"
        run: npx --yes --package @ast-grep/cli ast-grep scan
