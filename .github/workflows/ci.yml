name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verification-gates:
    if: (!hashFiles('.github/workflows/init.yml') || github.repository == 'tanzhongyan-org/template-ts-backend')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: template_ts_backend
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.1
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup database
        run: bunx drizzle-kit push
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/template_ts_backend"

      - name: "Run Verification Gates"
        run: make check
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/template_ts_backend"
