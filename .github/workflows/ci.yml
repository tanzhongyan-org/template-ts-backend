name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    uses: tanzhongyan-org/.github/.github/workflows/ci.yml@0c54f703d2d0d24b6ec61c8ea0f0d1a7d220f3e9 # v1
    with:
      runtime: ts-backend
      postgres-db: template_ts_backend
      database-url: postgresql://postgres:password@localhost:5432/template_ts_backend
      install-command: bun install --frozen-lockfile
      db-setup-command: make db-push
