pre-commit:
  parallel: false
  commands:
    format-lint:
      glob: "*.{ts,tsx,js,jsx,mjs,json,jsonc,md}"
      # lefthook quotes each staged file itself, so pass them straight to biome.
      run: node_modules/.bin/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

    secrets:
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks git --staged --redact --no-banner
        else
          echo 'warning: gitleaks is not installed; skipping staged secret scan (https://github.com/gitleaks/gitleaks#installing)' >&2
        fi

    anti-slop:
      run: make slop

    policy:
      run: make policy

    ai-slop-regex:
      run: "! git diff --staged -U0 -- ':(exclude)*.md' | rg -i '\\b(as an ai language model|here is the (rest of the )?code|i hope this helps)\\b'"

commit-msg:
  commands:
    conventional-commit:
      run: "head -n1 {1} | grep -Eq '^(Merge |Revert |(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\([a-z0-9._/-]+\\))?!?: .+)'"
    forbid-ai-trailers:
      run: "! rg -i 'co-authored-by:.*(claude|copilot|assistant|gpt)' {1}"

pre-push:
  parallel: false
  commands:
    verify:
      run: make verify
    unit-tests:
      run: make test
