pre-commit:
  parallel: false
  commands:
    format-lint:
      glob: "*.{ts,tsx,js,jsx,json,md}"
      run: npx @biomejs/biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    ast-grep-stubs:
      run: npx --yes --package @ast-grep/cli@0.51.0 ast-grep scan

    ai-slop-regex:
      run: "! git diff --staged -U0 -- ':(exclude)*.md' | rg -i '\\b(as an ai language model|here is the (rest of the )?code|i hope this helps)\\b'"

commit-msg:
  commands:
    forbid-ai-trailers:
      run: "! rg -i 'co-authored-by:.*(claude|copilot|assistant|gpt)' {1}"

pre-push:
  parallel: false
  commands:
    typecheck:
      run: bun run typecheck
    fallow-dupes:
      run: npx --yes fallow@3.33.1 dupes --quiet --no-fragments
    unit-tests:
      run: bun run test
